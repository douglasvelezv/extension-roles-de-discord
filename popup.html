<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Discord Role Inspector</title>
  <link href="https://fonts.googleapis.com/css2?family=Syne:wght@400;600;700;800&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #0e0f13;
      --bg2: #16181f;
      --bg3: #1e2029;
      --border: #2a2d3a;
      --accent: #5865f2;
      --accent2: #eb459e;
      --text: #e8eaf0;
      --muted: #6b7280;
      --success: #57f287;
      --green: #23a55a;
    }
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      width: 380px;
      min-height: 200px;
      max-height: 620px;
      background: var(--bg);
      font-family: 'Syne', sans-serif;
      color: var(--text);
      overflow: hidden;
    }
    .header {
      background: linear-gradient(135deg, var(--bg2) 0%, #1a1c28 100%);
      padding: 16px 18px 14px;
      border-bottom: 1px solid var(--border);
      display: flex;
      align-items: center;
      gap: 12px;
      position: relative;
      overflow: hidden;
    }
    .header::before {
      content: '';
      position: absolute;
      top: -30px; right: -30px;
      width: 100px; height: 100px;
      background: radial-gradient(circle, rgba(88,101,242,0.3) 0%, transparent 70%);
      pointer-events: none;
    }
    .logo {
      width: 38px; height: 38px;
      background: linear-gradient(135deg, var(--accent), var(--accent2));
      border-radius: 12px;
      display: flex; align-items: center; justify-content: center;
      font-size: 20px;
      flex-shrink: 0;
      box-shadow: 0 4px 12px rgba(88,101,242,0.4);
    }
    .header-text h1 { font-size: 15px; font-weight: 800; letter-spacing: -0.3px; line-height: 1; }
    .header-text p { font-size: 11px; color: var(--muted); font-family: 'DM Mono', monospace; margin-top: 2px; }
    .header-btns { margin-left: auto; display: flex; gap: 8px; align-items: center; }
    .btn-scan {
      background: linear-gradient(135deg, var(--accent), #4752c4);
      border: none; color: white;
      padding: 8px 14px; border-radius: 8px;
      font-family: 'Syne', sans-serif; font-weight: 700; font-size: 12px;
      cursor: pointer; transition: all 0.2s; white-space: nowrap;
    }
    .btn-scan:hover { opacity: 0.85; transform: scale(0.97); }
    .btn-scan:active { transform: scale(0.93); }
    .btn-scan.loading { opacity: 0.6; pointer-events: none; }

    .btn-download {
      display: none;
      background: linear-gradient(135deg, var(--green), #1a7a42);
      border: none; color: white;
      padding: 8px 12px; border-radius: 8px;
      font-family: 'Syne', sans-serif; font-weight: 700; font-size: 12px;
      cursor: pointer; transition: all 0.2s; white-space: nowrap;
      align-items: center; gap: 5px;
    }
    .btn-download.visible { display: flex; }
    .btn-download:hover { opacity: 0.85; transform: scale(0.97); }
    .btn-download:active { transform: scale(0.93); }
    .btn-download.loading { opacity: 0.6; pointer-events: none; }

    .stats-bar {
      display: none;
      background: var(--bg2);
      padding: 10px 18px;
      border-bottom: 1px solid var(--border);
      gap: 18px; align-items: center;
    }
    .stats-bar.visible { display: flex; }
    .stat { display: flex; flex-direction: column; gap: 1px; }
    .stat-val { font-size: 18px; font-weight: 800; line-height: 1; }
    .stat-label { font-size: 9px; font-family: 'DM Mono', monospace; color: var(--muted); text-transform: uppercase; letter-spacing: 0.5px; }
    .divider { width: 1px; height: 28px; background: var(--border); }

    .search-wrap { display: none; padding: 10px 18px; background: var(--bg); border-bottom: 1px solid var(--border); }
    .search-wrap.visible { display: block; }
    .search-input {
      width: 100%; background: var(--bg3); border: 1px solid var(--border);
      border-radius: 8px; padding: 8px 12px; color: var(--text);
      font-family: 'DM Mono', monospace; font-size: 12px; outline: none;
      transition: border-color 0.2s;
    }
    .search-input:focus { border-color: var(--accent); }
    .search-input::placeholder { color: var(--muted); }

    .roles-list { overflow-y: auto; max-height: 350px; padding: 8px 0; }
    .roles-list::-webkit-scrollbar { width: 4px; }
    .roles-list::-webkit-scrollbar-track { background: transparent; }
    .roles-list::-webkit-scrollbar-thumb { background: var(--border); border-radius: 2px; }

    .role-item {
      display: flex; align-items: center; gap: 12px;
      padding: 9px 18px;
      border-bottom: 1px solid rgba(255,255,255,0.03);
      transition: background 0.15s;
      animation: fadeSlide 0.3s ease both;
    }
    .role-item:hover { background: var(--bg2); }
    @keyframes fadeSlide {
      from { opacity: 0; transform: translateX(-6px); }
      to { opacity: 1; transform: translateX(0); }
    }
    @keyframes spin { from { transform: rotate(0deg); } to { transform: rotate(360deg); } }

    .role-color-dot {
      width: 28px; height: 28px; border-radius: 8px; flex-shrink: 0;
      display: flex; align-items: center; justify-content: center;
      font-size: 14px; border: 1px solid rgba(255,255,255,0.08);
    }
    .role-color-dot.no-color { background: var(--bg3); border: 1px dashed var(--border); }
    .role-emoji-img { width: 18px; height: 18px; object-fit: contain; border-radius: 3px; }
    .role-info { flex: 1; min-width: 0; }
    .role-name { font-size: 13px; font-weight: 700; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; line-height: 1.2; }
    .role-meta { display: flex; gap: 8px; margin-top: 3px; align-items: center; flex-wrap: wrap; }
    .role-hex { font-family: 'DM Mono', monospace; font-size: 10px; color: var(--muted); background: var(--bg3); padding: 1px 5px; border-radius: 4px; }
    .role-badge { font-size: 9px; font-family: 'DM Mono', monospace; padding: 1px 5px; border-radius: 4px; font-weight: 500; }
    .badge-hoist { background: rgba(87,242,135,0.12); color: var(--success); }
    .badge-managed { background: rgba(235,69,158,0.12); color: var(--accent2); }
    .badge-everyone { background: rgba(88,101,242,0.12); color: #a0aaff; }
    .badge-img { background: rgba(255,165,0,0.12); color: #ffaa00; }
    .role-position { font-family: 'DM Mono', monospace; font-size: 10px; color: var(--muted); margin-left: auto; flex-shrink: 0; }

    .state { display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 40px 24px; text-align: center; gap: 12px; }
    .state-icon { font-size: 40px; }
    .state-title { font-size: 15px; font-weight: 700; }
    .state-desc { font-size: 12px; color: var(--muted); line-height: 1.5; font-family: 'DM Mono', monospace; }

    /* Toast notification */
    .toast {
      position: fixed; bottom: 12px; left: 50%; transform: translateX(-50%);
      background: var(--green); color: white;
      padding: 8px 18px; border-radius: 20px;
      font-size: 12px; font-weight: 700;
      opacity: 0; pointer-events: none;
      transition: opacity 0.3s;
      white-space: nowrap;
      z-index: 999;
    }
    .toast.show { opacity: 1; }
  </style>
</head>
<body>
  <div class="header">
    <div class="logo">🎖️</div>
    <div class="header-text">
      <h1>Role Inspector</h1>
      <p>discord.com</p>
    </div>
    <div class="header-btns">
      <button class="btn-download" id="btnDownload">⬇️ ZIP</button>
      <button class="btn-scan" id="btnScan">Escanear</button>
    </div>
  </div>

  <div class="stats-bar" id="statsBar">
    <div class="stat"><span class="stat-val" id="totalRoles">0</span><span class="stat-label">Rangos</span></div>
    <div class="divider"></div>
    <div class="stat"><span class="stat-val" id="coloredRoles">0</span><span class="stat-label">Con Color</span></div>
    <div class="divider"></div>
    <div class="stat"><span class="stat-val" id="emojiRoles">0</span><span class="stat-label">Con Emoji</span></div>
    <div class="divider"></div>
    <div class="stat"><span class="stat-val" id="hoistRoles">0</span><span class="stat-label">Visibles</span></div>
  </div>

  <div class="search-wrap" id="searchWrap">
    <input type="text" class="search-input" id="searchInput" placeholder="🔍  Buscar rango...">
  </div>

  <div id="mainContent">
    <div class="state" id="stateIdle">
      <div class="state-icon">🎭</div>
      <div class="state-title">Discord Role Inspector</div>
      <div class="state-desc">Abre un servidor en Discord y<br>presiona <strong>Escanear</strong> para ver sus rangos.</div>
    </div>
  </div>

  <div class="toast" id="toast">✅ Descargando ZIP...</div>

  <script src="popup.js"></script>
</body>
</html>
